<nav class="site-nav" role="navigation">
  <a href="{{ .Site.Home.RelPermalink }}" class="site-logo">
    {{ with .Site.Params.site_logo }}
      <img src="{{ relURL . }}" alt="{{ $.Site.Title }}" />
    {{ else }}
      {{ .Site.Title }}
    {{ end }}
  </a>

  <input type="checkbox" id="nav-toggle" class="nav-toggle" />
  <label class="nav-toggle-label" for="nav-toggle" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <div class="nav-panel">
    {{ if .Site.Menus.main }}
      <ul class="nav-links">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" title="{{ i18n "pageTitle" . }}">{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    {{ end }}
    {{ partial "i18nlist.html" . }}
    {{ partialCached "social-follow.html" . }}
  </div>
</nav>
